[install]
# Only install package versions published at least 5 days ago
minimumReleaseAge = 432000
ignoreScripts = true
linkWorkspacePackages = false
linker = "hoisted"
#minimumReleaseAgeExcludes = ["oxlint","oxlint-tsgolint"]


[test]
# Multiple patterns
# Plugin-shipped frontend apps carry browser-dependent tests; they run under
# each plugin's own bunfig (which preloads the frontend jsdom setup).
pathIgnorePatterns = [
    "frontend/**",
    "plugin/*/frontend/**"
]

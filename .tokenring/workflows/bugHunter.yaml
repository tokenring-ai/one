# TokenRing workflow definition. The file name is the workflow name.
displayName: All-Package Bug Hunter
category: Code Review
description: This agent will automatically find and fix 3 small bugs in each package in the TokenRing monorepo
agentType: leader
steps: 
  - "/function define js getPackageDirectories() { return (await import('fs')).globSync('pkg/*') }"
  - /list @packages = getPackageDirectories()
  - "/for $pkg in @packages {\n  /eval /agent run --neverFail --type code-quality-engineer Search for all the files in $pkg/, identify 3 small bugs in the package code, and fix each one\n}\n"
subAgent: 
  forwardChatOutput: false
  forwardStatusMessages: true
  forwardSystemOutput: false
  forwardHumanRequests: true
  forwardReasoning: false
  forwardInputCommands: true
  timeout: 0
  maxResponseLength: 10000
  minContextLength: 1000

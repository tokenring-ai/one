# TokenRing workflow definition. The file name is the workflow name.
displayName: All-Package Documentation Updater
category: Documentation
description: This agent will automatically update the documentation for each package in the TokenRing monorepo
agentType: leader
steps: 
  - "/function define js getPackageDirectories() { return (await import('fs')).globSync('plugin/*') }"
  - /list @packages = getPackageDirectories()
  - "/for $pkg in @packages {\n  /eval /agent run --neverFail --type documentation-engineer Search for all the files in $pkg/, and methodically update the packages README to match the current code in the package;\n  /eval /agent run --neverFail --type documentation-engineer Search for all the files in $pkg/, and methodically update or create documentation in docs/docs/plugins/ to match the current functionality of the package (plugin)\n}\n"
  - "/eval /agent run --neverFail --type documentation-engineer Search for all the files in backend*, and methodically update the backend/README.md to match the current code in the package"
subAgent: 
  forwardChatOutput: false
  forwardStatusMessages: true
  forwardSystemOutput: false
  forwardHumanRequests: true
  forwardReasoning: false
  forwardInputCommands: true
  timeout: 0
  maxResponseLength: 10000
  minContextLength: 1000

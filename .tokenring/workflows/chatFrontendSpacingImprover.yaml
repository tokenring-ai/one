# TokenRing workflow definition. The file name is the workflow name.
displayName: Chat Frontend Spacing Improver
category: Frontend
description: "Reviews and improves component spacing (padding, margin, gaps) for consistency with parent components in the chat frontend"
agentType: leader
steps: 
  - "/function define js getChatTsxFiles() { return (await import('fs')).globSync('frontend/chat/src/**/*.tsx') }"
  - /list @files = getChatTsxFiles()
  - "/for $file in @files {\n  /eval /agent run --neverFail --type ui-ux-designer Review the spacing in $file — padding, margin, gap, and layout spacing utilities. Check that spacing is consistent with the design system's spacing scale, avoids arbitrary values, and feels balanced relative to the component's parent and children. Fix any spacing that looks cramped, excessive, or inconsistent.\n}\n"
subAgent: 
  forwardChatOutput: false
  forwardStatusMessages: true
  forwardSystemOutput: false
  forwardHumanRequests: true
  forwardReasoning: false
  forwardInputCommands: true
  timeout: 0
  maxResponseLength: 10000
  minContextLength: 1000

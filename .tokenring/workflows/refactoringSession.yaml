# TokenRing workflow definition. The file name is the workflow name.
displayName: All-Package Refactoring Agent
category: Brainstorming
description: This agent will automatically analyze code and identify refactoring opportunities for each package in the TokenRing monorepo
agentType: leader
steps: 
  - "/function define js getPackageDirectories() { return (await import('fs')).globSync('pkg/*') }"
  - /list @packages = getPackageDirectories()
  - "/for $pkg in @packages {\n  /eval /agent run --neverFail --type code-quality-engineer Search for all the files in $pkg/, analyze code for common refactoring opportunities, code smells, complexity issues, architectural improvements, outdated patterns and practices - and save those ideas in a 'design/code-quality/{idea_name}.md' file\n}\n"
subAgent: 
  forwardChatOutput: false
  forwardStatusMessages: true
  forwardSystemOutput: false
  forwardHumanRequests: true
  forwardReasoning: false
  forwardInputCommands: true
  timeout: 0
  maxResponseLength: 10000
  minContextLength: 1000

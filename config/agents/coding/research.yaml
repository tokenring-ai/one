agents:
  research:
    displayName: Deep Research
    description: Multi-file deep research reports using web search, todos, and filesystem.
    category: Research
    chat:
      systemPrompt: |
        You are a deep research agent. Your job is to produce thorough, verified, multi-file research dossiers on disk.

        For every research request, follow this process:
        1. Create a new subdirectory under the current working directory for this research project.
           Use a slug/date-friendly name derived from the topic (e.g. 2026-07-09-solid-state-batteries).
        2. Plan the work with the todo tool: outline topics, search tasks, writing tasks, and review.
        3. Use web search and page fetch tools to gather factual, verified information from reputable sources.
           Cite specific URLs for every claim. Prefer verbatim extraction of key data. No speculation.
           If sources conflict, report both sides and note the discrepancy.
        4. Write markdown outputs inside the project subdirectory:
           - SUMMARY.md — executive summary of findings
           - TOC.md — table of contents linking to each topic file
           - One markdown file per major topic/section with a deep dive
        5. Finish only when SUMMARY.md, TOC.md, and all topic files are complete and consistent.

        Do not leave the research incomplete. Prefer multiple focused files over one giant blob.
      enabledTools:
        - websearch_*
        - todo
        - file_*
commands:
  deep research:
    agentType: research
    requireNewAgent: false
    description: Perform deep multi-file research on a topic or goal
    help: |
      Starts a deep research run that writes a structured markdown dossier to disk.

      The agent will:
      - Create a project subdirectory under its working directory
      - Plan with todos
      - Search and cite web sources
      - Write SUMMARY.md, TOC.md, and per-topic deep-dive files

      ## Usage
      /deep research <topic or goal>

      ## Examples
      /deep research Solid-state battery commercialization timeline 2024-2026
      /deep research Compare regulatory approaches to open-source AI models in the US and EU
      /deep research Market landscape for local-first AI developer tools

      ## Notes
      - When run on a research agent, work continues in the foreground on that agent.
      - When run from another agent type, a background research agent is started.
    steps:
      - |
        The user has requested deep research on the following topic or goal:
        ------
        {{ prompt }}
        ------
        Create a new project directory under the working directory for this topic.
        Use the todo tool to plan outline, search, writing, and review steps.
        Use web search and page fetch to gather verified sources with citations.
        Write SUMMARY.md, TOC.md (with links to topic files), and individual
        markdown deep-dive files for each major topic. Begin now.
tools:
  deep_research:
    agentType: research
    description: Start a deep multi-file research project on a topic. Writes SUMMARY.md, TOC.md, and topic files under the research working directory.
    displayName: Research Agents/Deep Research
    inputArguments:
      prompt:
        description: The topic or goal to research deeply.
      context:
        description: Optional conversation context or constraints.
    steps:
      - |
        The user has requested deep research on the following topic or goal:
        ------
        {{ prompt }}

        Important context:
        {{ context }}
        ------
        Create a new project directory under the working directory for this topic.
        Use the todo tool to plan outline, search, writing, and review steps.
        Use web search and page fetch to gather verified sources with citations.
        Write SUMMARY.md, TOC.md (with links to topic files), and individual
        markdown deep-dive files for each major topic. Begin now.
